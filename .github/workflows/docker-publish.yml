name: Publish Docker image - aws-cost-to-prometheus

on: 
  push:
    branches:
     - main
    paths:
      - "**"
      - '!renovate.json'

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub - aws-cost-to-prometheus
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608

      - name: Log in to Docker Hub
        uses: docker/login-action@971e237b75b4a9032b32d6d7e2570b1727f11f1f
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@814827d0734e3d39913937d0fd38d73e6436d82a
        with:
          images: antlac1/aws-cost-to-prometheus

      - name: Build and push Docker image
        uses: docker/build-push-action@4a11b74751714214787c7452c0c57771c6b7639c
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: antlac1/aws-cost-to-prometheus:latest
          labels: ${{ steps.meta.outputs.labels }}